<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Farmácia Parecetaloka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cálculo de Pedido - Farmácia Parecetaloka</h2>
        <form method="POST" action="calculo.php">
            <div class="form-group">
                <label>Nome do Cliente:</label>
                <input type="text" name="nome" required>
            </div>

            <div class="form-group">
                <label>Total do Pedido (R$):</label>
                <input type="number" step="0.01" name="total_pedido" required>
            </div>

            <div class="form-group">
                <label>Faixa Etária:</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="maior de 50" value="sim">
                        Maior de 50 anos
                    </label>
                    <label>
                        <input type="checkbox" name="entre 51 e 70" value="sim">
                        De 51 a 70 anos
                    </label>
                    <label>
                        <input type="checkbox" name="maior de 70" value="sim">
                        Maior de 70 anos
                    </label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="cartao_fidelidade" value="sim">
                        Pagamento com Cartão Fidelidade?
                    </label>
                </div>
            </div>

            <button type="submit">Calcular Total</button>
        </form>
    </div>
</body>
</html>
